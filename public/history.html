<!DOCTYPE html>
<html>
<head>
    <title>Badminton Match History</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="viewer-page">

<div class="viewer-shell">
    <div class="viewer-top">
        <h1>Match History</h1>
        <a href="viewer.html" class="viewer-link">Back to Live Viewer</a>
    </div>

    <div class="match-log-panel">
        <table class="match-log-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Player 1</th>
                    <th>Game Scores</th>
                    <th>Player 2</th>
                    <th>Winner</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="matchLogBody">
                <tr><td colspan="6">Loading match history...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/history.js"></script>
</body>
</html>
