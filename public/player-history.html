<!DOCTYPE html>
<html>
<head>
    <title>Player Match History</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="viewer-page">
    <div class="viewer-shell">
        <div class="viewer-top">
            <h1 id="playerHistoryTitle">Player Match History</h1>
            <div class="viewer-links">
                <a href="history.html" class="viewer-link">Back to Match History</a>
                <a href="ranking.html" class="viewer-link">Back to Rankings</a>
            </div>
        </div>

        <div class="match-log-panel">
            <table class="match-log-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Opponent</th>
                        <th>Result</th>
                        <th>Game Scores</th>
                        <th>Winner</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="playerHistoryBody">
                    <tr><td colspan="6">Loading player history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/player-history.js"></script>
</body>
</html>
